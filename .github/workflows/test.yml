name: tests
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (stdlib only, no dependencies)
        run: python3 -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python3 skills/skill-airlock/airlock --version
